<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow"><meta name="referrer" content="no-referrer"><title>Setup · MBCI + AWC Footprint</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Semi+Condensed:wght@500;600;700&display=swap">
<style>
/* Layout: an operations board for a merged plant network. Navy masthead, KPI band,
   the map as the centrepiece with a plant rail, then tabbed workbenches. */
:root{
  --bg:#edf1f5; --surface:#ffffff; --surface-2:#f5f8fb; --surface-3:#e9eff5;
  --ink:#0d1b29; --ink-2:#3f5368; --muted:#66798d; --line:#d6dee7; --line-2:#e6ecf2;
  --brand:#005192; --brand-2:#008cca; --brand-soft:#c8dcf0; --on-brand:#ffffff;
  --head-bg:#005192; --head-ink:#ffffff; --head-ink-2:#c8dcf0; --head-strip:#008cca;
  --focus:#008cca;
  --water:#d3e4f3; --land:#ffffff; --land-ctx:#e9eef3; --b-state:#c2d0de; --b-country:#7f97ae; --map-label:#7a8da1; --halo:#ffffff;
  --mbci:#4a3aa7; --awc:#eb6834; --other:#8d98a5; --tbd:#c3c9d1;
  --akzo-1:#005192; --akzo-2:#3f88c5; --akzo-3:#8fb9de;
  --good:#0ca30c; --good-2:#7cc67c; --warn:#fab219; --serious:#ec835a; --crit:#d03b3b; --neutral:#8d98a5; --closed:#4b5563; --operating:#6b8299;
  --good-ink:#0a6b0a; --warn-ink:#875b00; --crit-ink:#a82626;
  --move:#005192; --move-2:#66798d;
  --inverse:#0d1b29; --on-inverse:#ffffff;
  --shadow-lg:0 12px 40px rgba(13,27,41,.18), 0 2px 6px rgba(13,27,41,.08);
  --font-ui:"Barlow", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-cond:"Barlow Semi Condensed", "Barlow", system-ui, -apple-system, "Segoe UI", sans-serif;
  --r:10px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#08111a; --surface:#0f1b27; --surface-2:#142231; --surface-3:#1a2a3b;
    --ink:#e6edf5; --ink-2:#a8b8c8; --muted:#7d8fa2; --line:#233447; --line-2:#1b2a3a;
    --brand:#4aa3e3; --brand-2:#4fb8e8; --brand-soft:#16324d; --on-brand:#05111c;
    --head-bg:#0b2a45; --head-ink:#ffffff; --head-ink-2:#9fc3e3; --head-strip:#008cca;
    --focus:#4fb8e8;
    --water:#0b1a29; --land:#1a2938; --land-ctx:#132130; --b-state:#2d4156; --b-country:#527090; --map-label:#7d8fa2; --halo:#1a2938;
    --mbci:#9085e9; --awc:#d95926; --other:#7d8a98; --tbd:#4a5868;
    --akzo-1:#cfe3f5; --akzo-2:#5ea3dc; --akzo-3:#2f74b5;
    --good-2:#4f9d4f; --neutral:#7d8a98; --closed:#9aa5b1; --operating:#7f98b0;
    --good-ink:#4cc94c; --warn-ink:#f5c04a; --crit-ink:#ff8080;
    --move:#4fb8e8; --move-2:#8fa2b5;
    --inverse:#e6edf5; --on-inverse:#0b1520;
    --shadow-lg:0 12px 40px rgba(0,0,0,.5), 0 2px 6px rgba(0,0,0,.3);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
    --bg:#08111a; --surface:#0f1b27; --surface-2:#142231; --surface-3:#1a2a3b;
    --ink:#e6edf5; --ink-2:#a8b8c8; --muted:#7d8fa2; --line:#233447; --line-2:#1b2a3a;
    --brand:#4aa3e3; --brand-2:#4fb8e8; --brand-soft:#16324d; --on-brand:#05111c;
    --head-bg:#0b2a45; --head-ink:#ffffff; --head-ink-2:#9fc3e3; --head-strip:#008cca;
    --focus:#4fb8e8;
    --water:#0b1a29; --land:#1a2938; --land-ctx:#132130; --b-state:#2d4156; --b-country:#527090; --map-label:#7d8fa2; --halo:#1a2938;
    --mbci:#9085e9; --awc:#d95926; --other:#7d8a98; --tbd:#4a5868;
    --akzo-1:#cfe3f5; --akzo-2:#5ea3dc; --akzo-3:#2f74b5;
    --good-2:#4f9d4f; --neutral:#7d8a98; --closed:#9aa5b1; --operating:#7f98b0;
    --good-ink:#4cc94c; --warn-ink:#f5c04a; --crit-ink:#ff8080;
    --move:#4fb8e8; --move-2:#8fa2b5;
    --inverse:#e6edf5; --on-inverse:#0b1520;
    --shadow-lg:0 12px 40px rgba(0,0,0,.5), 0 2px 6px rgba(0,0,0,.3);
    color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);font:400 15px/1.45 var(--font-ui);}
h1,h2,h3,h4{margin:0;font-family:var(--font-cond);font-weight:600;letter-spacing:.005em;text-wrap:balance;color:var(--ink)}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--brand)}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.sr{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ---------- masthead ---------- */
.top{background:var(--head-bg);color:var(--head-ink);border-bottom:4px solid var(--head-strip)}
.top-in{max-width:1480px;margin:0 auto;padding-block:18px 16px;padding-inline:max(16px,3vw);display:flex;flex-wrap:wrap;gap:14px 28px;align-items:flex-end;justify-content:space-between}
.brandblock{min-width:0;flex:1 1 420px}
.eyebrow{font:600 12px/1 var(--font-cond);letter-spacing:.12em;text-transform:uppercase;color:var(--head-ink-2)}
.top h1{color:var(--head-ink);font-size:clamp(26px,3.2vw,34px);font-weight:700;line-height:1.05;margin-top:6px}
.top h1 .plus{color:var(--head-strip);font-weight:600;padding-inline:.12em}
.top .lede{color:var(--head-ink-2);margin-top:6px;max-width:68ch;font-size:15px}
.top-actions{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.stamp{font-size:13px;color:var(--head-ink-2);margin-right:6px;line-height:1.3}
.stamp b{color:var(--head-ink);font-weight:600}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;min-height:36px;padding:0 14px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font-weight:600;font-size:14px;cursor:pointer;white-space:nowrap;text-decoration:none}
.btn:hover{background:var(--surface-2)}
.btn svg{width:16px;height:16px;flex:none}
.btn.primary{background:var(--brand);border-color:var(--brand);color:var(--on-brand)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.quiet{border-color:transparent;background:transparent}
.btn.quiet:hover{background:var(--surface-3)}
.btn.danger{color:var(--crit-ink);border-color:color-mix(in srgb,var(--crit) 45%,var(--line))}
.btn.small{min-height:30px;padding:0 10px;font-size:13px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.top .btn{background:transparent;color:var(--head-ink);border-color:rgba(255,255,255,.35)}
.top .btn:hover{background:rgba(255,255,255,.12)}
.top .btn.on{background:#ffffff;color:#005192;border-color:#ffffff}
.chip-ro{font:600 12px/1 var(--font-cond);letter-spacing:.06em;text-transform:uppercase;padding:7px 10px;border-radius:999px;border:1px solid rgba(255,255,255,.35);color:var(--head-ink-2)}

.editbar{background:color-mix(in srgb,var(--brand-2) 16%,var(--surface));border-bottom:1px solid color-mix(in srgb,var(--brand-2) 40%,var(--line));}
.editbar-in{max-width:1480px;margin:0 auto;padding-block:10px;padding-inline:max(16px,3vw);display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;font-size:14px}
.editbar-in b{font-weight:700}
.notice{max-width:1480px;margin:12px auto 0;padding-inline:max(16px,3vw)}
.notice-in{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;padding:10px 14px;border-radius:var(--r);border:1px solid color-mix(in srgb,var(--warn) 60%,var(--line));background:color-mix(in srgb,var(--warn) 12%,var(--surface));font-size:14px}

/* ---------- page ---------- */
.wrap{max-width:1480px;margin:0 auto;padding-block:18px 120px;padding-inline:max(16px,3vw);display:flex;flex-direction:column;gap:18px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);min-width:0}
.sec-label{font:600 12px/1 var(--font-cond);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}

/* KPI band */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.kpi{all:unset;box-sizing:border-box;display:flex;flex-direction:column;gap:6px;padding:14px 16px 15px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);cursor:pointer;min-width:0}
.kpi:hover{border-color:color-mix(in srgb,var(--brand) 40%,var(--line))}
.kpi:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.kpi .v{font:600 30px/1.05 var(--font-ui);color:var(--ink);letter-spacing:-.01em}
.kpi .v small{font-size:15px;font-weight:500;color:var(--ink-2);margin-left:4px}
.kpi .s{font-size:13.5px;color:var(--ink-2);line-height:1.35}
.kpi .meter{height:6px;border-radius:3px;background:var(--surface-3);overflow:hidden;margin-top:2px}
.kpi .meter i{display:block;height:100%;background:var(--brand);border-radius:3px}

/* insights */
.insights{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:12px}
.ins{padding:14px 16px;display:flex;flex-direction:column;gap:6px}
.ins .tag{font:600 11.5px/1 var(--font-cond);letter-spacing:.1em;text-transform:uppercase;color:var(--brand)}
.ins h3{font-size:19px}
.ins p{font-size:14.5px;color:var(--ink-2);max-width:62ch}
.ins .lnk{all:unset;cursor:pointer;color:var(--brand);font-weight:600;font-size:14px;margin-top:2px;width:max-content}
.ins .lnk:hover{text-decoration:underline}
.ins .lnk:focus-visible{outline:2px solid var(--focus);outline-offset:2px}

/* map + rail */
.mapgrid{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:14px;align-items:stretch}
.mapcard{display:flex;flex-direction:column;overflow:hidden}
.cardhead{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;justify-content:space-between;padding:12px 14px;border-bottom:1px solid var(--line-2)}
.cardhead h2{font-size:20px}
.cardhead .hint{font-size:13px;color:var(--muted)}
.controls{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.seg{display:inline-flex;background:var(--surface-3);border-radius:9px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{all:unset;cursor:pointer;padding:6px 11px;border-radius:7px;font:600 13.5px/1.1 var(--font-ui);color:var(--ink-2)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.seg button:focus-visible{outline:2px solid var(--focus)}
.switch{display:inline-flex;align-items:center;gap:8px;font-size:14px;font-weight:500;color:var(--ink-2);cursor:pointer;user-select:none}
.switch input{appearance:none;width:34px;height:20px;border-radius:999px;background:var(--surface-3);border:1px solid var(--line);position:relative;cursor:pointer;margin:0;transition:background .15s}
.switch input::after{content:"";position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:50%;background:var(--muted);transition:transform .15s, background .15s}
.switch input:checked{background:var(--brand);border-color:var(--brand)}
.switch input:checked::after{transform:translateX(14px);background:var(--on-brand)}

.mapbox{position:relative;background:var(--water);aspect-ratio:1000/640;width:100%;overflow:hidden;touch-action:pan-y}
.mapbox svg{display:block;width:100%;height:100%;user-select:none;-webkit-user-select:none}
.mapbox.placing svg{cursor:crosshair}
.mapbox svg .ocean{fill:var(--water)}
.mapbox svg .land{fill:var(--land);stroke:none}
.mapbox svg .land-ctx{fill:var(--land-ctx)}
.mapbox svg .lakes{fill:var(--water)}
.mapbox svg .mesh-state{fill:none;stroke:var(--b-state);stroke-width:.8px;vector-effect:non-scaling-stroke}
.mapbox svg .mesh-country{fill:none;stroke:var(--b-country);stroke-width:1.3px;vector-effect:non-scaling-stroke}
.mapbox svg .coast{fill:none;stroke:var(--b-state);stroke-width:.6px;vector-effect:non-scaling-stroke}
.st-label{fill:var(--map-label);font-family:var(--font-cond);font-weight:600;letter-spacing:.06em;text-anchor:middle;dominant-baseline:central;opacity:0;transition:opacity .2s;pointer-events:none}
.show-st .st-label{opacity:.85}
.ct-label{fill:var(--map-label);font-family:var(--font-cond);font-weight:600;letter-spacing:.32em;text-anchor:middle;pointer-events:none;opacity:.75}
.pin{cursor:pointer}
.pin .dot{stroke:var(--surface);}
.pin .ring{fill:none}
.pin .selring{fill:none;stroke:var(--ink)}
.pin.dim{opacity:.18}
.pin:focus{outline:none}
.pin:focus-visible .selring{stroke:var(--focus);display:inline}
.pin .leader{stroke:var(--ink-2);opacity:.6}
.plabel{font-family:var(--font-cond);font-weight:600;fill:var(--ink);paint-order:stroke;stroke:var(--halo);stroke-linejoin:round;cursor:pointer}
.plabel.dim{opacity:.25}
.move{fill:none;stroke-linecap:round}
.move.expected{stroke:var(--move)}
.move.possible{stroke:var(--move-2)}
.move-hit{fill:none;stroke:transparent;cursor:help}
.zoomctl{position:absolute;right:10px;top:10px;display:flex;flex-direction:column;gap:1px;border-radius:9px;overflow:hidden;border:1px solid var(--line);background:var(--line);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.zoomctl button{all:unset;cursor:pointer;width:34px;height:34px;display:grid;place-items:center;background:var(--surface);color:var(--ink)}
.zoomctl button:hover{background:var(--surface-2)}
.zoomctl button:focus-visible{outline:2px solid var(--focus);outline-offset:-2px}
.zoomctl svg{width:16px;height:16px}
.regions{position:absolute;left:10px;bottom:10px;display:flex;flex-wrap:wrap;gap:6px;max-width:calc(100% - 70px)}
.regions button{all:unset;cursor:pointer;font:600 12.5px/1 var(--font-ui);padding:7px 10px;border-radius:999px;background:color-mix(in srgb,var(--surface) 92%,transparent);border:1px solid var(--line);color:var(--ink-2)}
.regions button:hover,.regions button[aria-pressed="true"]{color:var(--ink);border-color:var(--brand)}
.regions button:focus-visible{outline:2px solid var(--focus)}
.maptip{position:absolute;z-index:5;pointer-events:none;min-width:240px;max-width:300px;background:var(--surface);border:1px solid var(--line);border-radius:9px;box-shadow:var(--shadow-lg);padding:10px 12px;font-size:13.5px;line-height:1.35}
.maptip h4{font-size:16px;margin-bottom:2px}
.maptip .r{display:flex;justify-content:space-between;gap:12px;color:var(--ink-2)}
.maptip .r b{color:var(--ink);font-weight:600;text-align:right}
.maptip .r span{white-space:nowrap}
.maptip .k{color:var(--muted);font-size:12.5px;margin-top:6px}
.mapbanner{position:absolute;left:50%;top:10px;transform:translateX(-50%);z-index:4;display:flex;align-items:center;gap:10px;padding:7px 8px 7px 14px;border-radius:999px;background:var(--inverse);color:var(--on-inverse);font-size:14px;font-weight:500;max-width:calc(100% - 70px);box-shadow:var(--shadow-lg)}
.mapbanner button{all:unset;cursor:pointer;font-weight:700;font-size:13px;padding:5px 10px;border-radius:999px;background:color-mix(in srgb,var(--on-inverse) 16%,transparent)}
.maphint{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);background:var(--inverse);color:var(--on-inverse);padding:8px 14px;border-radius:999px;font-size:14px;font-weight:500;pointer-events:none;opacity:0;transition:opacity .2s}
.maphint.show{opacity:.92}
.legend{display:flex;flex-wrap:wrap;gap:8px 18px;padding:11px 14px 13px;border-top:1px solid var(--line-2);font-size:13.5px;color:var(--ink-2);align-items:center}
.legend .li{display:inline-flex;align-items:center;gap:7px}
.legend .sw{width:12px;height:12px;border-radius:50%;flex:none}
.legend .n{color:var(--muted)}
.legend .sep{width:1px;height:18px;background:var(--line)}
.legend svg{flex:none}

.rail{position:relative;min-height:420px}
.rail-in{position:absolute;inset:0;display:flex;flex-direction:column;overflow:hidden;border-radius:var(--r)}
.railhead{padding:12px 14px;border-bottom:1px solid var(--line-2);display:flex;flex-direction:column;gap:10px}
.railhead .row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.search{width:100%;min-height:38px;border:1px solid var(--line);border-radius:8px;background:var(--surface-2);padding:0 12px 0 34px;font-size:14.5px;background-image:none}
.searchwrap{position:relative}
.searchwrap svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);width:16px;height:16px;color:var(--muted);pointer-events:none}
.rail-list{list-style:none;margin:0;padding:6px 0 10px;overflow:auto;flex:1;min-height:0}
.rail-group{font:600 12px/1 var(--font-cond);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);padding:12px 14px 6px;display:flex;align-items:center;gap:7px}
.rail-group i{width:9px;height:9px;border-radius:50%}
.rrow{all:unset;box-sizing:border-box;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 10px;width:100%;padding:8px 14px;cursor:pointer;border-left:3px solid transparent}
.rrow:hover,.rrow.hover{background:var(--surface-2)}
.rrow.sel{background:color-mix(in srgb,var(--brand) 9%,var(--surface));border-left-color:var(--brand)}
.rrow:focus-visible{outline:2px solid var(--focus);outline-offset:-2px}
.rrow .nm{font-weight:600;font-size:15px;color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rrow .rg{font-size:13px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rrow .rt{text-align:right;font-size:13px;color:var(--ink-2);white-space:nowrap}
.rrow .rt b{font-weight:600;color:var(--ink)}
.rrow .pills{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:5px;margin-top:3px}
.rail-foot{padding:10px 14px;border-top:1px solid var(--line-2)}

/* pills */
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;line-height:1;padding:5px 9px 5px 8px;border-radius:999px;background:var(--surface-3);color:var(--ink);white-space:nowrap}
.pill i{width:8px;height:8px;border-radius:50%;flex:none;background:var(--neutral)}
.pill.ghost{background:transparent;border:1px solid var(--line);color:var(--ink-2)}

/* tabs */
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:thin}
.tabs button{all:unset;cursor:pointer;padding:11px 14px 10px;font:600 15.5px/1 var(--font-cond);letter-spacing:.02em;color:var(--ink-2);border-bottom:3px solid transparent;white-space:nowrap;display:inline-flex;gap:7px;align-items:center}
.tabs button:hover{color:var(--ink)}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--brand)}
.tabs button:focus-visible{outline:2px solid var(--focus);outline-offset:-2px}
.tabs .badge{font:700 11.5px/1 var(--font-ui);padding:3px 6px;border-radius:999px;background:var(--surface-3);color:var(--ink-2)}
.tabs .badge.warn{background:color-mix(in srgb,var(--warn) 30%,var(--surface));color:var(--warn-ink)}
.panel{display:flex;flex-direction:column;gap:14px}
.panel-head{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:flex-end;justify-content:space-between}
.panel-head h2{font-size:22px}
.panel-head p{color:var(--ink-2);max-width:72ch;margin-top:4px;font-size:14.5px}
.pad{padding:16px}

/* capacity chart */
.cap{display:flex;flex-direction:column;gap:2px}
.cap-axis,.crow{display:grid;grid-template-columns:150px minmax(0,1fr) 210px;gap:14px;align-items:center}
.cap-axis{padding:0 0 6px;font-size:12px;color:var(--muted)}
.cap-axis .ticks{position:relative;height:16px}
.cap-axis .ticks span{position:absolute;transform:translateX(-50%);white-space:nowrap}
.cap-group{font:600 12px/1 var(--font-cond);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);padding:14px 0 6px}
.crow{all:unset;box-sizing:border-box;display:grid;grid-template-columns:150px minmax(0,1fr) 210px;gap:14px;align-items:center;padding:7px 0;border-top:1px solid var(--line-2);cursor:pointer}
.crow:hover{background:var(--surface-2)}
.crow:focus-visible{outline:2px solid var(--focus)}
.crow .nm{font-weight:600;display:flex;align-items:center;gap:8px;min-width:0}
.crow .nm span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.crow .nm i{width:9px;height:9px;border-radius:50%;flex:none}
.cbar{position:relative;height:22px}
.cbar .grid{position:absolute;top:-7px;bottom:-7px;width:1px;background:var(--line-2)}
.cbar .track{position:absolute;left:0;top:5px;height:12px;border-radius:3px;background:var(--surface-3)}
.cbar .fill{position:absolute;left:0;top:5px;height:12px;border-radius:0 4px 4px 0}
.cbar .tick{position:absolute;top:2px;width:2px;height:18px;background:var(--ink-2);border-radius:1px;transform:translateX(-1px)}
.cbar .tick.t24{opacity:.45}
.cbar .proj{position:absolute;top:3px;height:16px;border:1.5px dashed var(--ink-2);border-radius:4px;min-width:4px}
.cbar .maxl{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--ink);transform:translateX(-1px)}
.crow .val{font-size:13.5px;color:var(--ink-2);line-height:1.3}
.crow .val b{color:var(--ink);font-weight:600}
.crow .val .over{color:var(--crit-ink);font-weight:600}
.cap-legend{display:flex;flex-wrap:wrap;gap:8px 18px;font-size:13px;color:var(--ink-2);padding-top:12px}
.cap-legend span{display:inline-flex;align-items:center;gap:7px}
.lg-fill{width:18px;height:10px;border-radius:2px;background:var(--mbci)}
.lg-tick{width:2px;height:14px;background:var(--ink-2)}
.lg-proj{width:18px;height:12px;border:1.5px dashed var(--ink-2);border-radius:3px}
.lg-max{width:2px;height:16px;background:var(--ink)}
.nocap{font-size:14px;color:var(--ink-2);padding-top:10px}
.linkbtn{all:unset;cursor:pointer;color:var(--brand);font-weight:600}
.linkbtn:hover{text-decoration:underline}
.linkbtn:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.upside{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}
.up{padding:14px 16px;display:flex;flex-direction:column;gap:4px}
.up .big{font:600 24px/1.1 var(--font-ui)}
.up .sub{font-size:13.5px;color:var(--ink-2)}
.assume{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:13.5px;color:var(--ink-2)}
.assume input{width:76px;min-height:32px;border:1px solid var(--line);border-radius:7px;background:var(--surface-2);padding:0 8px}

/* tables */
.tablewrap{overflow:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
table.t{border-collapse:separate;border-spacing:0;width:100%;font-size:14px}
table.t th,table.t td{padding:9px 12px;text-align:left;border-bottom:1px solid var(--line-2);vertical-align:top}
table.t th{font:600 12.5px/1.2 var(--font-cond);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);background:var(--surface-2);position:sticky;top:0;z-index:1;white-space:nowrap}
table.t td.n,table.t th.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
table.t tbody tr{cursor:pointer}
table.t tbody tr:hover td{background:var(--surface-2)}
table.t tfoot td{font-weight:700;background:var(--surface-2)}
table.t tr:last-child td{border-bottom:0}

/* akzo bars */
.abar{display:grid;grid-template-columns:150px minmax(0,1fr) 230px;gap:14px;align-items:center;padding:7px 0;border-top:1px solid var(--line-2);cursor:pointer}
.abar:hover{background:var(--surface-2)}
.abar .bar{height:14px;border-radius:0 4px 4px 0;min-width:2px}
.abar .val{font-size:13.5px;color:var(--ink-2)}
.abar .val b{color:var(--ink);font-weight:600}
.split{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:14px;align-items:start}

/* brands */
.brandcols{display:grid;grid-template-columns:1fr 1fr;gap:14px;align-items:start}
.bcol{padding:4px 0 8px}
.bcol h3{font-size:18px;display:flex;align-items:center;gap:8px;padding:12px 16px 4px}
.bcol h3 i{width:10px;height:10px;border-radius:50%}
.btier{font:600 12px/1 var(--font-cond);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);padding:12px 16px 4px}
.brow{all:unset;box-sizing:border-box;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 12px;width:100%;padding:8px 16px;cursor:pointer;border-left:3px solid transparent}
.brow:hover{background:var(--surface-2)}
.brow.on{background:color-mix(in srgb,var(--brand) 9%,var(--surface));border-left-color:var(--brand)}
.brow:focus-visible{outline:2px solid var(--focus);outline-offset:-2px}
.brow .bn{font-weight:600}
.brow .bs{font-size:13.5px;color:var(--ink-2);text-align:right}
.brow .bt{grid-column:1/-1;font-size:13px;color:var(--muted)}
.brow .unm{color:var(--warn-ink)}

/* grid editor */
.gridtools{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.gridtools .search{width:240px}
.gsel{min-height:36px;border:1px solid var(--line);border-radius:8px;background:var(--surface-2);padding:0 8px;font-size:14px}
.gridwrap{max-height:72vh}
table.g{font-size:13.5px}
table.g th{cursor:pointer}
table.g th[aria-sort] .ar{opacity:1}
table.g th .ar{opacity:.3;margin-left:3px}
table.g td,table.g th{padding:7px 10px;white-space:nowrap}
table.g td.wrap{white-space:normal;min-width:220px;max-width:340px}
table.g td.wrap .clamp{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
table.g th:first-child,table.g td:first-child{position:sticky;left:0;z-index:2;background:var(--surface)}
table.g th:first-child{z-index:3;background:var(--surface-2)}
table.g tbody tr:hover td:first-child{background:var(--surface-2)}
table.g td input,table.g td select{width:100%;min-width:90px;min-height:32px;border:1px solid var(--line);border-radius:6px;background:var(--surface-2);padding:0 7px;font-size:13.5px}
table.g td input.w-l{min-width:180px}
table.g td input.w-s{min-width:70px}
table.g td.first{font-weight:600}
.editing table.g tbody tr{cursor:default}

/* TSR */
.tsr{display:grid;grid-template-columns:260px minmax(0,1fr);gap:14px;align-items:start}
.tsr-sites{padding:6px 0}
.tsr-q{padding:4px 0}
.qa{display:grid;grid-template-columns:34px minmax(0,1fr);gap:4px 12px;padding:14px 18px;border-top:1px solid var(--line-2)}
.qa:first-child{border-top:0}
.qa .qn{font:700 15px/1.3 var(--font-cond);color:var(--brand)}
.qa .qq{font-weight:600;font-size:15px}
.qa .qw{font-size:13px;color:var(--muted)}
.qa .qr{grid-column:2;margin-top:6px;font-size:14.5px;padding:8px 12px;border-radius:8px;background:var(--surface-2)}
.qa .qr.empty{color:var(--muted);font-style:italic;background:transparent;border:1px dashed var(--line)}
.qa textarea{grid-column:2;margin-top:6px}
.tsr-head{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;padding:14px 18px;border-bottom:1px solid var(--line-2)}
.prog{display:inline-flex;align-items:center;gap:8px;font-size:13px;color:var(--ink-2)}
.prog .pm{width:60px;height:5px;border-radius:3px;background:var(--surface-3);overflow:hidden}
.prog .pm i{display:block;height:100%;background:var(--brand)}

/* checks */
.checks{display:flex;flex-direction:column}
.chk{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:start;padding:12px 16px;border-top:1px solid var(--line-2)}
.chk:first-child{border-top:0}
.chk .sv{display:inline-flex;align-items:center;gap:6px;font:600 12px/1 var(--font-cond);letter-spacing:.08em;text-transform:uppercase;padding:5px 8px;border-radius:6px;white-space:nowrap}
.chk .sv svg{width:13px;height:13px}
.sv.crit{background:color-mix(in srgb,var(--crit) 14%,var(--surface));color:var(--crit-ink)}
.sv.warn{background:color-mix(in srgb,var(--warn) 22%,var(--surface));color:var(--warn-ink)}
.sv.info{background:var(--surface-3);color:var(--ink-2)}
.chk .ct b{font-weight:600}
.chk .ct p{color:var(--ink-2);font-size:14px;margin-top:2px}

/* drawer */
.scrim{position:fixed;inset:0;background:rgba(5,12,20,.28);z-index:40}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(470px,100%);background:var(--surface);z-index:41;box-shadow:var(--shadow-lg);display:flex;flex-direction:column;border-left:1px solid var(--line)}
.dr-top{padding:calc(16px + env(safe-area-inset-top,0px)) 18px 14px;border-bottom:1px solid var(--line-2);display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 10px}
.dr-kick{font:600 12.5px/1 var(--font-cond);letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2);display:flex;gap:7px;align-items:center}
.dr-kick i{width:9px;height:9px;border-radius:50%}
.dr-top h2{font-size:28px;line-height:1.05;grid-column:1}
.dr-top .rg{font-size:14px;color:var(--muted);grid-column:1}
.dr-top .pills{display:flex;flex-wrap:wrap;gap:6px;grid-column:1/-1;margin-top:6px}
.dr-top .x{grid-column:2;grid-row:1/span 3;align-self:start;display:flex;gap:6px}
.iconbtn{all:unset;cursor:pointer;width:36px;height:36px;display:grid;place-items:center;border-radius:8px;color:var(--ink-2);border:1px solid var(--line)}
.iconbtn:hover{background:var(--surface-2);color:var(--ink)}
.iconbtn:focus-visible{outline:2px solid var(--focus)}
.iconbtn svg{width:18px;height:18px}
.dr-body{overflow:auto;flex:1;padding:6px 18px calc(110px + env(safe-area-inset-bottom,0px))}
.dr-sec{padding:14px 0;border-bottom:1px solid var(--line-2)}
.dr-sec:last-child{border-bottom:0}
.dr-sec h3{font:600 12.5px/1 var(--font-cond);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:10px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.stat{background:var(--surface-2);border-radius:8px;padding:10px 11px;min-width:0}
.stat .l{font-size:12px;color:var(--muted);font-weight:600}
.stat .v{font:600 20px/1.15 var(--font-ui);margin-top:3px}
.stat .s{font-size:12.5px;color:var(--ink-2);margin-top:2px}
.mini{display:flex;flex-direction:column;gap:6px;margin-top:12px}
.mini .mr{display:grid;grid-template-columns:62px minmax(0,1fr) 96px;gap:10px;align-items:center;font-size:13px;color:var(--ink-2)}
.mini .mt{height:9px;border-radius:0 3px 3px 0;background:var(--surface-3);position:relative;overflow:visible}
.mini .mt i{position:absolute;left:0;top:0;bottom:0;border-radius:0 3px 3px 0}
.mini .mr .n{text-align:right;color:var(--ink);font-variant-numeric:tabular-nums}
dl.kv{display:grid;grid-template-columns:150px minmax(0,1fr);gap:8px 12px;margin:0;font-size:14.5px}
dl.kv dt{color:var(--muted);font-size:13.5px}
dl.kv dd{margin:0;color:var(--ink);overflow-wrap:anywhere}
dl.kv dd.empty{color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:5px 10px;border-radius:999px;background:var(--surface-3);font-size:13.5px;font-weight:500;border:0;cursor:pointer;color:var(--ink)}
.chip:hover{background:color-mix(in srgb,var(--brand) 12%,var(--surface-3))}
.chip .rm{all:unset;cursor:pointer;font-weight:700;color:var(--muted);padding:0 2px}
.mvlist{display:flex;flex-direction:column;gap:8px}
.mv{display:grid;grid-template-columns:auto minmax(0,1fr);gap:2px 10px;padding:9px 11px;border-radius:8px;background:var(--surface-2);font-size:14px}
.mv .ln{width:22px;height:0;border-top:2px solid var(--move);margin-top:9px}
.mv .ln.possible{border-top-style:dashed;border-top-color:var(--move-2)}
.mv .nt{grid-column:2;color:var(--ink-2);font-size:13.5px}
.para{font-size:14.5px;color:var(--ink);white-space:pre-wrap}
.para.empty{color:var(--muted)}

/* form fields */
.form{display:grid;grid-template-columns:1fr 1fr;gap:10px 12px}
.fld{display:flex;flex-direction:column;gap:5px;min-width:0}
.fld.wide{grid-column:1/-1}
.fld>span{font-size:12.5px;font-weight:600;color:var(--ink-2)}
.fld input,.fld select,.fld textarea,textarea.ta{width:100%;min-height:38px;border:1px solid var(--line);border-radius:8px;background:var(--surface-2);padding:7px 10px;font-size:14.5px}
.fld textarea,textarea.ta{min-height:76px;resize:vertical;line-height:1.4}
.fld input:focus,.fld select:focus,.fld textarea:focus,textarea.ta:focus,table.g td input:focus,table.g td select:focus{outline:2px solid var(--focus);outline-offset:0;border-color:transparent;background:var(--surface)}
.buildgrid{display:grid;grid-template-columns:52px repeat(2,minmax(0,1fr)) minmax(0,1.3fr);gap:6px 8px;align-items:center;font-size:13px}
.buildgrid .h{font-size:12px;font-weight:600;color:var(--muted)}
.buildgrid input{width:100%;min-height:34px;border:1px solid var(--line);border-radius:7px;background:var(--surface-2);padding:0 8px;font-size:14px}
.buildgrid input:focus{outline:2px solid var(--focus);border-color:transparent;background:var(--surface)}
.mvedit{display:grid;grid-template-columns:minmax(0,1fr) 110px auto;gap:6px;align-items:center;padding:9px;border-radius:8px;background:var(--surface-2)}
.mvedit select,.mvedit input{min-height:34px;border:1px solid var(--line);border-radius:7px;background:var(--surface);padding:0 8px;font-size:14px;width:100%}
.mvedit input{grid-column:1/-1}
.confirm{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:10px 12px;border-radius:8px;background:color-mix(in srgb,var(--crit) 10%,var(--surface));font-size:14px}

/* save bar, toast, modal */
.savebar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:60;display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px;background:var(--inverse);color:var(--on-inverse);padding:10px 10px 10px 18px;border-radius:12px;box-shadow:var(--shadow-lg);width:max-content;max-width:calc(100% - 32px)}
.savebar .msg{font-size:14.5px;font-weight:500}
.savebar .msg b{font-weight:700}
.savebar .btn{border-color:color-mix(in srgb,var(--on-inverse) 30%,transparent);background:transparent;color:var(--on-inverse)}
.savebar .btn.primary{background:var(--brand-2);border-color:var(--brand-2);color:#ffffff}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:70;background:var(--surface);color:var(--ink);border:1px solid var(--line);box-shadow:var(--shadow-lg);padding:10px 16px;border-radius:10px;font-size:14.5px;max-width:calc(100% - 32px);opacity:0;pointer-events:none;transition:opacity .2s}
.toast.show{opacity:1}
.modal{position:fixed;inset:0;z-index:80;background:rgba(5,12,20,.4);display:grid;place-items:center;padding:16px}
.modal-in{background:var(--surface);border-radius:14px;box-shadow:var(--shadow-lg);width:min(620px,100%);max-height:86vh;display:flex;flex-direction:column;overflow:hidden;border:1px solid var(--line)}
.modal-in header{padding:18px 20px 10px}
.modal-in header h2{font-size:22px}
.modal-in .mb{padding:4px 20px 16px;overflow:auto;font-size:14.5px;display:flex;flex-direction:column;gap:10px}
.modal-in .mb ul{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:4px}
.modal-in footer{padding:12px 20px 16px;display:flex;justify-content:flex-end;gap:8px;border-top:1px solid var(--line-2)}
footer.src{font-size:13px;color:var(--muted);line-height:1.5;max-width:110ch}
.empty-state{padding:40px 20px;text-align:center;color:var(--ink-2)}


/* ---------- team workspace ---------- */
.top-side{display:flex;flex-direction:column;gap:10px;align-items:flex-end}
.status{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;justify-content:flex-end;font-size:13px;color:var(--head-ink-2);min-height:28px}
.status b{color:var(--head-ink);font-weight:600}
.live{display:inline-flex;align-items:center;gap:7px;font:600 12.5px/1 var(--font-ui);padding:6px 10px;border-radius:999px;background:rgba(255,255,255,.12);color:var(--head-ink);white-space:nowrap}
.live i{width:8px;height:8px;border-radius:50%;background:#9aa7b4}
.live.on i{background:#3ddc84;box-shadow:0 0 0 3px rgba(61,220,132,.25)}
.live.snap i{background:#f5c04a}
.here{display:inline-flex;align-items:center;gap:8px}
.avs{display:inline-flex;align-items:center}
.av{width:26px;height:26px;border-radius:50%;object-fit:cover;flex:none;background:var(--surface-3);display:inline-block}
.status .av{border:2px solid var(--head-bg)}
.avs .av+.av{margin-left:-8px}
.avs .more{font:600 12px/1 var(--font-ui);margin-left:6px;color:var(--head-ink-2)}
.savestate{font-size:13px;color:var(--ink-2);white-space:nowrap}
.editbar-r{display:inline-flex;gap:12px;align-items:center}
.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg)}
.help{padding:16px 18px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 16px;border-color:color-mix(in srgb,var(--brand) 35%,var(--line))}
.help h2{font-size:20px}
.help p{font-size:14.5px;color:var(--ink-2);max-width:80ch}
.help ol{grid-column:1/-1;margin:6px 0 0;padding-left:20px;display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:8px 28px;font-size:14.5px;color:var(--ink-2)}
.help ol b{color:var(--ink)}
.note-new{display:flex;flex-direction:column;gap:8px;margin-bottom:14px;align-items:flex-start}
.note-new textarea{min-height:64px}
.notes{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:12px}
.note{display:grid;grid-template-columns:28px minmax(0,1fr);gap:10px}
.note .av{width:28px;height:28px}
.note .nh{font-size:12.5px;color:var(--muted);display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.note .nh b{color:var(--ink);font-weight:600;font-size:14px}
.note p{font-size:14.5px;white-space:pre-wrap;overflow-wrap:anywhere;margin-top:2px}
.acts{display:flex;flex-direction:column}
.act{display:grid;grid-template-columns:30px minmax(0,1fr) auto;gap:12px;align-items:start;padding:12px 16px;border-top:1px solid var(--line-2)}
.act:first-child{border-top:0}
.act .av{width:30px;height:30px}
.act .tx{font-size:14.5px;line-height:1.45;overflow-wrap:anywhere}
.act .tx .old{color:var(--muted);text-decoration:line-through}
.act .tm{font-size:12.5px;color:var(--muted);margin-top:2px}
.act .quote{display:block;margin-top:4px;padding:4px 10px;border-left:3px solid var(--line);color:var(--ink-2);white-space:pre-wrap}
.rrow .meta{grid-column:1/-1;display:flex;gap:10px;align-items:center;margin-top:4px;font-size:12.5px;color:var(--muted)}
.rrow .meta .av{width:20px;height:20px}
.ico{display:inline-flex;align-items:center;gap:4px}
.ico svg{width:13px;height:13px}
.dr-who{grid-column:1/-1;font-size:12.5px;color:var(--muted);margin-top:6px}
@media (max-width:820px){
  .top-side{align-items:flex-start}
  .status{justify-content:flex-start}
  .act{grid-template-columns:30px minmax(0,1fr)}
  .act>.btn{grid-column:2;justify-self:start}
}

@media (max-width:1180px){
  .mapgrid{grid-template-columns:1fr}
  .rail{min-height:0}
  .rail-in{position:static;max-height:480px}
  .split{grid-template-columns:1fr}
}
@media (max-width:820px){
  .brandcols,.tsr{grid-template-columns:1fr}
  .cap-axis,.crow{grid-template-columns:100px minmax(0,1fr);}
  .crow .val{grid-column:1/-1;padding-left:0}
  .cap-axis>div:last-child{display:none}
  .abar{grid-template-columns:100px minmax(0,1fr)}
  .abar .val{grid-column:1/-1}
  dl.kv{grid-template-columns:120px minmax(0,1fr)}
  .cap-axis .ticks .minor{display:none}
  .regions{display:none}
}
@media (max-width:520px){
  .kpis{grid-template-columns:1fr 1fr}
  .kpi .v{font-size:24px}
  .kpi:last-child:nth-child(odd){grid-column:1/-1}
  .stat .v{font-size:17px}
  .form{grid-template-columns:1fr}
  .top .lede{font-size:14px}
  .gridtools .search{width:100%}
}
@media (prefers-reduced-motion: reduce){
  *{transition:none!important;animation:none!important;scroll-behavior:auto!important}
}

/* ---------- points of contact ---------- */
.tabs .badge.crit{background:color-mix(in srgb,var(--crit) 22%,var(--surface));color:var(--crit-ink)}
.poc-tools .search{max-width:300px}
.pgroup{display:flex;flex-direction:column;gap:10px}
.pgroup h3{font-size:18px;display:flex;align-items:center;gap:8px}
.pgroup h3 i{width:10px;height:10px;border-radius:50%;flex:none}

    <div class="fp-eyebrow">AkzoNobel · Account team · Owner setup</div>
    <h1 class="fp-title">MBCI <span>+</span> AWC Footprint</h1>
  </div>
  <section class="card su-card" id="su"><p class="fp-p">Checking the site…</p></section>
  <p class="su-foot">The access key is saved only in encrypted form, locked with the site password. Anyone who has the password can view and edit the data, so share it only with the account team.</p>
</main>
<script>/* Shared crypto + GitHub helpers for the password-protected site.
   Every sensitive file is AES-256-GCM encrypted with a key derived from the password (PBKDF2-SHA256). */
window.FP = (() => {
  const SITE = window.FP_SITE || { owner: 'raw0522d1-wq', repo: 'mbci-awc-footprint', dataBranch: 'data', dataPath: 'data.enc.json', api: 'https://api.github.com' };
  const ITER = 600000;
  const te = new TextEncoder(), td = new TextDecoder();
  const b64e = bytes => { const u = bytes instanceof Uint8Array ? bytes : new Uint8Array(bytes); let s = ''; for (let i = 0; i < u.length; i += 0x8000) s += String.fromCharCode.apply(null, u.subarray(i, i + 0x8000)); return btoa(s); };
  const b64d = s => Uint8Array.from(atob(String(s).replace(/\s+/g, '')), c => c.charCodeAt(0));
  async function deriveKey(password, salt, iter = ITER) {
    const base = await crypto.subtle.importKey('raw', te.encode(password), 'PBKDF2', false, ['deriveKey']);
    return crypto.subtle.deriveKey({ name: 'PBKDF2', hash: 'SHA-256', salt, iterations: iter }, base, { name: 'AES-GCM', length: 256 }, true, ['encrypt', 'decrypt']);
  }
  async function encrypt(key, salt, obj, iter = ITER) {
    const iv = crypto.getRandomValues(new Uint8Array(12));
    const ct = await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, key, te.encode(JSON.stringify(obj)));
    return { v: 1, kdf: { name: 'PBKDF2', hash: 'SHA-256', iter, salt: b64e(salt) }, iv: b64e(iv), ct: b64e(ct) };
  }
  async function decrypt(key, env) {
    const pt = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64d(env.iv) }, key, b64d(env.ct));
    return JSON.parse(td.decode(pt));
  }
  const exportKey = async key => b64e(await crypto.subtle.exportKey('raw', key));
  const importKey = raw => crypto.subtle.importKey('raw', b64d(raw), { name: 'AES-GCM' }, true, ['encrypt', 'decrypt']);
  const newSalt = () => crypto.getRandomValues(new Uint8Array(16));
  const utf8b64 = str => b64e(te.encode(str));
  const b64utf8 = s => td.decode(b64d(s));

  class GHError extends Error { constructor(status, msg) { super(msg); this.status = status; this.code = status === 401 || status === 403 ? 'auth' : status === 409 || status === 422 ? 'conflict' : status === 404 ? 'not_found' : 'unavailable'; } }
  async function gh(token, path, opts = {}) {
    const headers = { Accept: 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28', ...(opts.headers || {}) };
    if (token) headers.Authorization = 'Bearer ' + token;
    let r;
    try { r = await fetch(SITE.api + path, { ...opts, headers, cache: 'no-store' }); }
    catch { throw new GHError(0, 'Could not reach GitHub. Check your connection.'); }
    return r;
  }
  async function ghJSON(token, path, opts) {
    const r = await gh(token, path, opts);
    if (!r.ok) { let m = ''; try { m = (await r.json()).message || ''; } catch { /* no body */ } throw new GHError(r.status, m || ('GitHub answered ' + r.status)); }
    return r.status === 204 ? null : r.json();
  }
  const repoPath = p => `/repos/${SITE.owner}/${SITE.repo}${p}`;
  // Read a file through the contents API. Returns {sha, text, etag} or null when it does not exist.
  async function readFile(token, path, ref, etag) {
    const r = await gh(token, repoPath(`/contents/${path}?ref=${encodeURIComponent(ref)}`), { headers: etag ? { 'If-None-Match': etag } : {} });
    if (r.status === 304) return { notModified: true };
    if (r.status === 404) return null;
    if (!r.ok) { let m = ''; try { m = (await r.json()).message || ''; } catch { /* no body */ } throw new GHError(r.status, m); }
    const j = await r.json();
    let content = j.content;
    if (!content && j.sha) { const blob = await ghJSON(token, repoPath(`/git/blobs/${j.sha}`)); content = blob.content; }
    return { sha: j.sha, text: b64utf8(content), etag: r.headers.get('ETag') };
  }
  async function writeFile(token, path, branch, text, sha, message = 'Update data') {
    const body = { message, content: utf8b64(text), branch };
    if (sha) body.sha = sha;
    const j = await ghJSON(token, repoPath(`/contents/${path}`), { method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
    return j.content.sha;
  }
  async function deleteFile(token, path, branch, sha, message = 'Remove setup file') {
    return ghJSON(token, repoPath(`/contents/${path}`), { method: 'DELETE', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ message, sha, branch }) });
  }
  return { SITE, ITER, deriveKey, encrypt, decrypt, exportKey, importKey, newSalt, b64e, b64d, gh, ghJSON, readFile, writeFile, deleteFile, repoPath, GHError };
})();
</script>
<script>(() => {
  const { SITE, deriveKey, encrypt, decrypt, newSalt, b64d, readFile, writeFile, deleteFile, gh, ghJSON, repoPath, ITER } = window.FP;
  const $ = s => document.querySelector(s);
  const esc = v => String(v ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const box = $('#su');
  const tokensUrl = 'https://github.com/settings/personal-access-tokens';
  const tokenHelp = `<details class="su-help"><summary>How to make the GitHub access key (2 minutes)</summary><ol>
      <li>Sign in to GitHub as <b>${esc(SITE.owner)}</b>, then open <a href="${tokensUrl}/new" target="_blank" rel="noopener">github.com/settings/personal-access-tokens/new</a>.</li>
      <li><b>Token name:</b> MBCI AWC Footprint site. <b>Expiration:</b> the longest you're comfortable with, up to a year. Note the date: when it expires, come back here to add a new key.</li>
      <li><b>Resource owner:</b> ${esc(SITE.owner)}.</li>
      <li><b>Repository access:</b> choose <b>Only select repositories</b>, then pick <b>${esc(SITE.repo)}</b>. (Don't choose “Public repositories”; that kind of key can only read.)</li>
      <li><b>Permissions:</b> find <b>Contents</b> under Repository permissions (on newer screens, click <b>Add permissions</b> and pick Contents) and set it to <b>Read and write</b>. Metadata switches to Read-only by itself; leave it.</li>
      <li>Click <b>Generate token</b>, then copy the key right away with the copy button. It starts with <code>github_pat_</code> and is about 90 characters long. GitHub shows it only once.</li></ol></details>`;
  const fld = (id, label, type = 'password', extra = '') => `<label class="fp-fld"><span>${label}</span><input type="${type}" id="${id}" ${extra}></label>`;
  const steps = list => `<ol class="su-steps">${list.map(s => `<li class="${s.state || ''}"><span class="dot"></span>${esc(s.label)}${s.note ? `<small>${esc(s.note)}</small>` : ''}</li>`).join('')}</ol>`;
  let stepList = [];
  const setStep = (i, state, note) => { stepList[i].state = state; if (note !== undefined) stepList[i].note = note; $('#su-progress').innerHTML = steps(stepList); };
  // fail(message, link?) shows a plain-language problem under the button, with an optional link to fix it.
  const fail = (msg, link, detail) => {
    const e = $('#su-err'); e.textContent = msg;
    if (msg && link) { e.append(' '); const a = document.createElement('a'); a.href = link.href; a.target = '_blank'; a.rel = 'noopener'; a.textContent = link.label; e.append(a); }
    if (msg && detail) { const d = document.createElement('span'); d.className = 'fp-err-detail'; d.textContent = 'GitHub’s answer: ' + detail; e.append(d); }
    const b = $('#su-go'); if (b) { b.disabled = false; b.textContent = b.dataset.label; }
  };
  const normCode = c => String(c || '').toUpperCase().replace(/[^0-9A-Z]/g, '');
  // Keys pasted from email or chat often pick up spaces, line breaks or quotes.
  const cleanToken = t => String(t || '').replace(/\s+/g, '').replace(/^["'`“”‘’<]+|["'`“”‘’>]+$/g, '');
  const TOKEN_RE = /^(github_pat_|ghp_|gho_|ghu_|ghs_)[A-Za-z0-9_]{20,}$|^[0-9a-f]{40}$/;

  // A problem whose message is already written for the person; shown as is.
  class Problem extends Error { constructor(msg, link, detail) { super(msg); this.link = link; this.detail = detail; } }
  const answer = (what, e) => `${what} → ${e.status || 'no answer'}${e.message ? ' ' + e.message : ''}`;
  const editKeyLink = { href: tokensUrl, label: 'Open your GitHub access keys' };

  // Step 0: is this a GitHub key at all, does GitHub recognise it, and whose is it?
  async function checkToken(token) {
    if (!token) throw new Problem('Paste the GitHub access key.');
    if (normCode(token).length === 25 && /^[0-9A-Z-]+$/i.test(token)) throw new Problem('That is the setup code. It goes in the first box. The access key comes from GitHub and starts with github_pat_.');
    if (!TOKEN_RE.test(token)) throw new Problem('That doesn’t look like a GitHub access key. A new key starts with github_pat_ and is about 90 characters long. GitHub shows it only once, right after you click Generate token. If you no longer have it, open the key on GitHub, click Regenerate token, and copy the new one.', editKeyLink);
    const r = await gh(token, '/user');
    if (r.status === 401) throw new Problem('GitHub doesn’t recognise this access key. Usually part of it was missed when copying, it has expired, or it was regenerated or deleted (regenerating makes the old key stop working). Copy the key again, or make a new one with the steps above.', editKeyLink);
    let login = '';
    if (r.ok) {
      try { login = (await r.json()).login || ''; } catch { /* keep going without the name */ }
      const scopes = r.headers.get('X-OAuth-Scopes'); // only classic keys report scopes
      if (/^(ghp_|[0-9a-f]{40}$)/.test(token) && scopes !== null && !/(^|[\s,])(public_)?repo([\s,]|$)/.test(scopes)) {
        throw new Problem('This is a classic GitHub key without the “repo” permission, so it can’t save anything. The simplest fix is to make a new fine-grained key with the steps above.', { href: tokensUrl + '/new', label: 'Make a fine-grained key' });
      }
    }
    await ghJSON(token, repoPath('')).catch(e => {
      if (e.code === 'not_found') throw noWrite(login, answer('reading the repository', e));
      throw e;
    });
    // Write access is proven by the first real write (creating the data branch), not guessed from
    // the repository's "permissions" summary, which doesn't reliably reflect fine-grained keys.
    return { login };
  }
  // The key works but isn't allowed to change the repository.
  function noWrite(login, detail) {
    const who = login ? ` (it belongs to the GitHub account ${login})` : '';
    if (login && login.toLowerCase() !== SITE.owner.toLowerCase()) {
      return new Problem(`GitHub recognises this key${who}, but the site is stored under the ${SITE.owner} account. Sign in to GitHub as ${SITE.owner} and make the key there.`, { href: tokensUrl + '/new', label: 'Make a key' }, detail);
    }
    return new Problem(`GitHub recognises this key${who}, but the key isn’t allowed to make changes to ${SITE.repo}. You don’t need a new key: on GitHub, click this key, then Edit. Set Repository access to “Only select repositories” → ${SITE.repo}, and set Contents to “Read and write”. Click Update, then press the button here again.`, editKeyLink, detail);
  }
  // Writes that GitHub refuses with 403/404 mean the key lacks write access.
  const writing = (login, what, p) => p.catch(e => { if (e.status === 403 || e.status === 404) throw noWrite(login, answer(what, e)); throw e; });
  async function ensureDataBranch(token, login) {
    try { await ghJSON(token, repoPath(`/git/ref/heads/${SITE.dataBranch}`)); return; } catch (e) { if (e.code !== 'not_found') throw e; }
    const repo = await ghJSON(token, repoPath(''));
    const main = await ghJSON(token, repoPath(`/git/ref/heads/${repo.default_branch || 'main'}`));
    await writing(login, 'creating the data branch', ghJSON(token, repoPath('/git/refs'), { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ ref: `refs/heads/${SITE.dataBranch}`, sha: main.object.sha }) }));
  }
  const problem = err => {
    if (err instanceof Problem) return fail(err.message, err.link, err.detail);
    if (err && err.status === 0) return fail('Could not reach GitHub. Check your connection, then try again.');
    if (err && err.status === 401) return fail('GitHub stopped accepting this access key partway through. Copy the key again, or make a new one with the steps above.', editKeyLink);
    console.error(err);
    if (err && err.status) return fail(`GitHub answered with an error (${err.status}${err.message ? ': ' + err.message : ''}). Wait a minute and try again; nothing is lost.`);
    fail(`Something went wrong${err && err.message ? ` (${err.message})` : ''}. Reload the page and try again; nothing is lost.`);
  };

  function pwChecks(pw, pw2, required) {
    if (!pw && !pw2 && !required) return null;
    if (pw.length < 12) return 'Use at least 12 characters for the password. It is the only thing protecting the data.';
    if (pw !== pw2) return 'The two passwords do not match.';
    return null;
  }

  async function firstTime(seedEnv) {
    box.innerHTML = `<h2>Set up the site</h2>
      <p class="fp-p">This runs once. It connects the site to its shared data and sets the password you will give the team.</p>
      <form id="su-form" class="fp-form">
        ${fld('su-code', 'Setup code (from Claude)', 'text', 'autocomplete="off" spellcheck="false" placeholder="XXXXX-XXXXX-XXXXX-XXXXX-XXXXX" required')}
        ${fld('su-token', 'GitHub access key', 'password', 'autocomplete="off" spellcheck="false" placeholder="github_pat_…" required')}
        ${tokenHelp}
        ${fld('su-pw', 'Site password (at least 12 characters)', 'password', 'autocomplete="new-password" minlength="12" required')}
        ${fld('su-pw2', 'Type the password again', 'password', 'autocomplete="new-password" minlength="12" required')}
        <button class="btn primary fp-btn" id="su-go" data-label="Set up the site" type="submit">Set up the site</button>
        <p class="fp-err" id="su-err" role="alert"></p>
        <div id="su-progress"></div>
      </form>`;
    $('#su-form').addEventListener('submit', async e => {
      e.preventDefault();
      const code = normCode($('#su-code').value), token = cleanToken($('#su-token').value), pw = $('#su-pw').value, pw2 = $('#su-pw2').value;
      const bad = pwChecks(pw, pw2, true); if (bad) return fail(bad);
      fail(''); const go = $('#su-go'); go.disabled = true; go.textContent = 'Working…';
      stepList = [{ label: 'Check the access key' }, { label: 'Unlock the starting data' }, { label: 'Prepare the data branch' }, { label: 'Encrypt and save the data' }, { label: 'Save the encrypted settings' }, { label: 'Remove the one-time setup file' }];
      setStep(0, 'busy');
      let i = 0;
      try {
        const { login } = await checkToken(token); setStep(0, 'ok', login ? `Key belongs to ${login}` : undefined); i = 1; setStep(1, 'busy');
        let seed;
        try { const k0 = await deriveKey(code, b64d(seedEnv.kdf.salt), seedEnv.kdf.iter); seed = await decrypt(k0, seedEnv); }
        catch { setStep(1, 'bad'); return fail('That setup code is not right. Copy it again from the chat with Claude.'); }
        setStep(1, 'ok'); i = 2; setStep(2, 'busy');
        await ensureDataBranch(token, login); setStep(2, 'ok'); i = 3; setStep(3, 'busy');
        const salt = newSalt(), key = await deriveKey(pw, salt, ITER);
        seed.updatedAt = new Date().toISOString();
        const dataEnv = await encrypt(key, salt, seed, ITER);
        const existing = await readFile(token, SITE.dataPath, SITE.dataBranch);
        await writing(login, 'saving the data', writeFile(token, SITE.dataPath, SITE.dataBranch, JSON.stringify(dataEnv), existing?.sha, 'Save encrypted data'));
        setStep(3, 'ok'); i = 4; setStep(4, 'busy');
        const cfgEnv = await encrypt(key, salt, { token, setAt: new Date().toISOString() }, ITER);
        const oldCfg = await readFile(token, 'config.enc.json', 'main');
        await writing(login, 'saving the settings', writeFile(token, 'config.enc.json', 'main', JSON.stringify(cfgEnv), oldCfg?.sha, 'Save encrypted settings'));
        setStep(4, 'ok'); i = 5; setStep(5, 'busy');
        const seedFile = await readFile(token, 'seed.enc.json', 'main');
        if (seedFile) await writing(login, 'removing the setup file', deleteFile(token, 'seed.enc.json', 'main', seedFile.sha));
        setStep(5, 'ok');
        done('The site is set up.');
      } catch (err) { setStep(i, 'bad'); problem(err); }
    });
  }

  async function update(cfgEnv) {
    box.innerHTML = `<h2>Change the password or access key</h2>
      <p class="fp-p">Enter the current password. Then add a new GitHub access key, a new password, or both. Leave a box empty to keep what you have.</p>
      <form id="su-form" class="fp-form">
        ${fld('su-cur', 'Current site password', 'password', 'autocomplete="current-password" required')}
        ${fld('su-token', 'New GitHub access key (optional)', 'password', 'autocomplete="off" spellcheck="false" placeholder="github_pat_…"')}
        ${tokenHelp}
        ${fld('su-pw', 'New site password (optional, at least 12 characters)', 'password', 'autocomplete="new-password"')}
        ${fld('su-pw2', 'Type the new password again', 'password', 'autocomplete="new-password"')}
        <button class="btn primary fp-btn" id="su-go" data-label="Save changes" type="submit">Save changes</button>
        <p class="fp-err" id="su-err" role="alert"></p>
        <div id="su-progress"></div>
      </form>`;
    $('#su-form').addEventListener('submit', async e => {
      e.preventDefault();
      const cur = $('#su-cur').value, newToken = cleanToken($('#su-token').value), pw = $('#su-pw').value, pw2 = $('#su-pw2').value;
      const bad = pwChecks(pw, pw2, false); if (bad) return fail(bad);
      if (!newToken && !pw) return fail('Add a new access key or a new password, or both.');
      fail(''); const go = $('#su-go'); go.disabled = true; go.textContent = 'Working…';
      stepList = [{ label: 'Unlock the current settings' }, { label: 'Check the access key' }, { label: 'Re-encrypt and save the data' }, { label: 'Save the encrypted settings' }];
      let i = 0; setStep(0, 'busy');
      try {
        let cfg, key;
        const salt0 = b64d(cfgEnv.kdf.salt);
        try { key = await deriveKey(cur, salt0, cfgEnv.kdf.iter); cfg = await decrypt(key, cfgEnv); }
        catch { setStep(0, 'bad'); return fail('That is not the current password.'); }
        setStep(0, 'ok'); i = 1; setStep(1, 'busy');
        const token = newToken || cfg.token;
        let login = '';
        try { ({ login } = await checkToken(token)); }
        catch (e) { if (!newToken && e instanceof Problem) throw new Problem('The saved access key no longer works (it has probably expired). Make a new key with the steps above and paste it in the access key box.', editKeyLink); throw e; }
        setStep(1, 'ok', login ? `Key belongs to ${login}` : undefined); i = 2; setStep(2, 'busy');
        const f = await readFile(token, SITE.dataPath, SITE.dataBranch);
        if (!f) throw new Problem('The shared data file is missing from the data branch.');
        const doc = await decrypt(key, JSON.parse(f.text));
        let salt = salt0, k2 = key;
        if (pw) { salt = newSalt(); k2 = await deriveKey(pw, salt, ITER); }
        await writing(login, 'saving the data', writeFile(token, SITE.dataPath, SITE.dataBranch, JSON.stringify(await encrypt(k2, salt, doc, ITER)), f.sha, 'Re-encrypt data'));
        setStep(2, 'ok'); i = 3; setStep(3, 'busy');
        const old = await readFile(token, 'config.enc.json', 'main');
        await writing(login, 'saving the settings', writeFile(token, 'config.enc.json', 'main', JSON.stringify(await encrypt(k2, salt, { ...cfg, token, setAt: new Date().toISOString() }, ITER)), old?.sha, 'Update encrypted settings'));
        setStep(3, 'ok');
        done(pw ? 'The new password is set. Give it to the team; the old one no longer works.' : 'The new access key is saved.');
      } catch (err) { setStep(i, 'bad'); problem(err); }
    });
  }

  function done(msg) {
    const url = new URL('./', location.href).href;
    box.innerHTML = `<h2>${esc(msg)}</h2>
      <p class="fp-p">Share this link with the team, together with the password (send the password separately, for example by phone or Teams chat):</p>
      <p class="su-url"><a href="./">${esc(url)}</a></p>
      <p class="fp-p">GitHub can take a minute or two to publish the change. If the site still says it isn't set up, wait a moment and reload.</p>
      <a class="btn primary fp-btn" href="./">Open the site</a>`;
  }

  (async () => {
    try {
      const [cfgR, seedR] = await Promise.all([fetch('config.enc.json?v=' + Date.now(), { cache: 'no-store' }), fetch('seed.enc.json?v=' + Date.now(), { cache: 'no-store' })]);
      if (cfgR.ok) return update(await cfgR.json());
      if (seedR.ok) return firstTime(await seedR.json());
      box.innerHTML = '<h2>Nothing to set up</h2><p class="fp-p">The setup file is missing and the site has no settings yet. Ask Claude to publish the site again.</p>';
    } catch { box.innerHTML = '<h2>The setup page could not load</h2><p class="fp-p">Check your connection and reload the page.</p>'; }
  })();
})();
</script>
</body></html>
